<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <title>Robô Doméstico Simples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    h1 {
      font-size: 18px;
      margin: 5px 0;
    }

    .container {
      display: flex;
      gap: 15px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgb(0 0 0 / 10%);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 200px;
      justify-content: center;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    canvas {
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>Simulador de Robô Doméstico</h1>
  <div class="container">
    <canvas id="gridCanvas" width="300" height="300"></canvas>
    <div class="controls">
      <button id="btnPlayPause">▶ Iniciar</button>
      <div class="stat">Episódio: <span id="lblEpisodio" style="color:#2563eb">1</span></div>
      <div class="stat">Pontos: <span id="lblPontos" style="color:#2563eb">0</span></div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById("gridCanvas");
      const ctx = canvas.getContext("2d");
      const TAM = 5, CELL = 300 / TAM;

      let obj = { x: 4, y: 4 }, obst = { x: 2, y: 2 }, agent = { x: 0, y: 0 };
      let ep = 1, pts = 0, loop = null, running = false;

      // Inicialização da matriz Q sem interrupções
      let Q = {};
      for (let x = 0; x < TAM; x++) {
        for (let y = 0; y < TAM; y++) {
          Q[x + "," + y] = [0.0, 0.0, 0.0, 0.0];
        }
      }

      function reset() {
        do {
          agent.x = Math.floor(Math.random() * TAM);
          agent.y = Math.floor(Math.random() * TAM);
        } while ((agent.x === obj.x && agent.y === obj.y) || (agent.x === obst.x && agent.y === obst.y));
      }
      reset();

      document.getElementById("btnPlayPause").addEventListener("click", (e) => {
        running = !running;
        if (running) {
          e.target.innerText = "⏸ Pausar";
          e.target.style.background = "#2563eb";
          loop = setInterval(step, 100);
        } else {
          e.target.innerText = "▶ Iniciar";
          e.target.style.background = "#16a34a";
          clearInterval(loop);
        }
      });

      function step() {
        let s = agent.x + "," + agent.y;
        let a;

        if (Math.random() < 0.3) {
          a = Math.floor(Math.random() * 4);
        } else {
          let valores = Q[s];
          a = valores.indexOf(Math.max(...valores));
        }

        if (a === 0 && agent.y > 0) agent.y--;
        if (a === 1 && agent.y < TAM - 1) agent.y++;
        if (a === 2 && agent.x > 0) agent.x--;
        if (a === 3 && agent.x < TAM - 1) agent.x++;

        let r = -1;
        let ns = agent.x + "," + agent.y;

        if (agent.x === obj.x && agent.y === obj.y) {
          r = 100;
          pts += 100;
          reset();
          ep++;
        } else if (agent.x === obst.x && agent.y === obst.y) {
          r = -100;
          pts -= 100;
          reset();
          ep++;
        } else {
          pts += r;
        }

        let maxQFuturo = Math.max(...Q[ns]);
        Q[s][a] += 0.1 * (r + 0.9 * maxQFuturo - Q[s][a]);

        document.getElementById("lblEpisodio").innerText = ep;
        document.getElementById("lblPontos").innerText = pts;
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.strokeStyle = "#e2e8f0";
        for (let i = 0; i <= TAM; i++) {
          ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 300); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(300, i * CELL); ctx.stroke();
        }
        ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("🗑️", obj.x * CELL + CELL / 2, obj.y * CELL + CELL / 2);
        ctx.fillText("💦", obst.x * CELL + CELL / 2, obst.y * CELL + CELL / 2);
        ctx.fillText("🧹", agent.x * CELL + CELL / 2, agent.y * CELL + CELL / 2);
      }
      draw();
    });
  </script>
</body>

</html>
