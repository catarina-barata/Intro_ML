<script>
  const canvas = document.getElementById("gridCanvas");
  const ctx = canvas.getContext("2d");

  const TAM_GRID = 5;
  const TAM_CELULA = canvas.width / TAM_GRID;

  let posObjetivo = { x: 4, y: 4 };
  let posObstaculo = { x: 2, y: 2 };
  let posAgente = { x: 0, y: 0 };

  let episodio = 1;
  let pontuacaoTotal = 0;

  let alpha = 0.1;
  let gamma = 0.9;
  let epsilon = 0.3;
  let fps = 10;
  let loopInterval;

  // CORREÇÃO: Criação explícita da matriz com os valores base
  let qTable = {};
  for (let x = 0; x < TAM_GRID; x++) {
    for (let y = 0; y < TAM_GRID; y++) {
      qTable[`${x},${y}`] = [0.0, 0.0, 0.0, 0.0];
    }
  }

  function reiniciarAgente() {
    let x, y;
    do {
      x = Math.floor(Math.random() * TAM_GRID);
      y = Math.floor(Math.random() * TAM_GRID);
    } while ((x === posObjetivo.x && y === posObjetivo.y) || (x === posObstaculo.x && y === posObstaculo.y));
    return { x, y };
  }

  posAgente = reiniciarAgente();

  document.getElementById("sldEpsilon").addEventListener("input", (e) => {
    epsilon = parseFloat(e.target.value);
    document.getElementById("txtEpsilon").innerText = epsilon.toFixed(2);
  });
  document.getElementById("sldVelocidade").addEventListener("input", (e) => {
    fps = parseInt(e.target.value);
    document.getElementById("txtVelocidade").innerText = fps;
    reiniciarLoop();
  });

  function atualizar() {
    let estadoAtual = `${posAgente.x},${posAgente.y}`;
    let acao;

    if (Math.random() < epsilon) {
      acao = Math.floor(Math.random() * 4);
    } else {
      let valoresQ = qTable[estadoAtual];
      acao = valoresQ.indexOf(Math.max(...valoresQ));
    }

    if (acao === 0 && posAgente.y > 0) posAgente.y--;
    if (acao === 1 && posAgente.y < TAM_GRID - 1) posAgente.y++;
    if (acao === 2 && posAgente.x > 0) posAgente.x--;
    if (acao === 3 && posAgente.x < TAM_GRID - 1) posAgente.x++;

    let proximoEstado = `${posAgente.x},${posAgente.y}`;
    let recompensa = -1;

    if (posAgente.x === posObjetivo.x && posAgente.y === posObjetivo.y) {
      recompensa = 100;
      pontuacaoTotal += 100;
      posAgente = reiniciarAgente();
      episodio++;
    } else if (posAgente.x === posObstaculo.x && posAgente.y === posObstaculo.y) {
      recompensa = -100;
      pontuacaoTotal -= 100;
      posAgente = reiniciarAgente();
      episodio++;
    } else {
      pontuacaoTotal += recompensa;
    }

    let maxQFuturo = Math.max(...qTable[proximoEstado]);
    qTable[estadoAtual][acao] += alpha * (recompensa + gamma * maxQFuturo - qTable[estadoAtual][acao]);

    document.getElementById("lblEpisodio").innerText = episodio;
    document.getElementById("lblPontos").innerText = pontuacaoTotal;

    desenhar();
  }

  function desenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1;
    for (let i = 0; i <= TAM_GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * TAM_CELULA, 0);
      ctx.lineTo(i * TAM_CELULA, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * TAM_CELULA);
      ctx.lineTo(canvas.width, i * TAM_CELULA);
      ctx.stroke();
    }

    ctx.fillStyle = "#16a34a";
    ctx.fillRect(posObjetivo.x * TAM_CELULA + 5, posObjetivo.y * TAM_CELULA + 5, TAM_CELULA - 10, TAM_CELULA - 10);

    ctx.fillStyle = "#dc2626";
    ctx.fillRect(posObstaculo.x * TAM_CELULA + 5, posObstaculo.y * TAM_CELULA + 5, TAM_CELULA - 10, TAM_CELULA - 10);

    ctx.fillStyle = "#2563eb";
    ctx.fillRect(posAgente.x * TAM_CELULA + 15, posAgente.y * TAM_CELULA + 15, TAM_CELULA - 30, TAM_CELULA - 30);
  }

  function reiniciarLoop() {
    clearInterval(loopInterval);
    loopInterval = setInterval(atualizar, 1000 / fps);
  }

  reiniciarLoop();
  desenhar(); // Força o primeiro desenho imediatamente no ecrã
</script>
